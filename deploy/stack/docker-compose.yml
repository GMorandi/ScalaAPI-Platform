services:
  postgres:
    image: docker.io/library/postgres:17-alpine@sha256:af194ccf3e2d7fe367012c7b88ce8b816c5c889b18a5b316799a1f0d7eac746a
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../..
      target: migrate
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=${POSTGRES_DB:-platform};Username=${POSTGRES_USER:-platform};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  garnet:
    image: ghcr.io/microsoft/garnet:sha-e7025a6@sha256:e105e6163812110f049bb3f92ea89b6921963cb6f23813ad3c5109df3f8683b1
    command: ["--auth", "Password", "--password", "${GARNET_PASSWORD:?GARNET_PASSWORD is required}"]
    volumes:
      - garnet_data:/data

  garnet-health:
    image: docker.io/library/busybox:1.36.1@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    environment:
      GARNET_PASSWORD: ${GARNET_PASSWORD:?GARNET_PASSWORD is required}
    depends_on:
      garnet:
        condition: service_started
    healthcheck:
      test: 'pass="$${GARNET_PASSWORD}"; len=$$(printf %s "$${pass}" | wc -c); { printf ''*2\r\n$$4\r\nAUTH\r\n$$%s\r\n%s\r\n'' "$${len}" "$${pass}"; printf ''*1\r\n$$4\r\nPING\r\n''; } | nc -w 2 garnet 6379 | grep PONG >/dev/null'
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage:
    image: docker.io/minio/minio:latest@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-platform}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
    volumes:
      - object_data:/data
    ports:
      - "${OBJECT_STORAGE_PORT:-9000}:9000"
      - "${OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  provider-mock:
    build:
      context: ../..
      target: provider-mock
    environment:
      MediaPollDelayMs: ${PROVIDER_MOCK_MEDIA_POLL_DELAY_MS:-0}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  platform-silo:
    build:
      context: ../..
      target: platform-silo
    restart: on-failure
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=${POSTGRES_DB:-platform};Username=${POSTGRES_USER:-platform};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      CapnpRpc__SocketPath: /var/run/scalaapi/dispatch.sock
      Garnet__Host: garnet
      Garnet__Port: 6379
      Garnet__Password: ${GARNET_PASSWORD:?GARNET_PASSWORD is required}
      Garnet__UseTls: ${GARNET_TLS:-false}
      Garnet__ServerName: ${GARNET_SERVER_NAME:-garnet}
      Garnet__CaCertificatePath: ${GARNET_CA_CERT_PATH:-}
      Security__MasterKey: ${SECURITY_MASTER_KEY:?SECURITY_MASTER_KEY is required}
      ProviderCredentials__AllowInsecureTokenEndpoints: ${PROVIDER_CREDENTIALS_ALLOW_INSECURE:-false}
      ProviderMock__BaseUrl: http://provider-mock:8081
      ContentClassifier__Endpoint: ${CONTENT_CLASSIFIER_ENDPOINT:-http://provider-mock:8081/v1/classifier/evaluate}
      ContentClassifier__TimeoutMs: ${CONTENT_CLASSIFIER_TIMEOUT_MS:-750}
      ContentClassifier__OpenAI__Endpoint: ${CONTENT_CLASSIFIER_OPENAI_ENDPOINT:-}
      ContentClassifier__OpenAI__ApiKey: ${CONTENT_CLASSIFIER_OPENAI_API_KEY:-}
      ContentClassifier__OpenAI__Model: ${CONTENT_CLASSIFIER_OPENAI_MODEL:-omni-moderation-latest}
      ContentClassifier__OpenAI__TimeoutMs: ${CONTENT_CLASSIFIER_OPENAI_TIMEOUT_MS:-750}
      ContentClassifier__OpenAI__AllowInsecure: ${CONTENT_CLASSIFIER_OPENAI_ALLOW_INSECURE:-false}
      ContentClassifier__OpenAI__Budget__MaxUnavailableRatio: ${CONTENT_CLASSIFIER_OPENAI_BUDGET_MAX_UNAVAILABLE_RATIO:-0.05}
      ContentClassifier__OpenAI__Budget__MaxP95Seconds: ${CONTENT_CLASSIFIER_OPENAI_BUDGET_MAX_P95_SECONDS:-2.5}
      ContentClassifier__OpenAI__Budget__MinimumSamples: ${CONTENT_CLASSIFIER_OPENAI_BUDGET_MINIMUM_SAMPLES:-20}
      ContentClassifier__OpenAI__Budget__WindowSeconds: ${CONTENT_CLASSIFIER_OPENAI_BUDGET_WINDOW_SECONDS:-900}
      Dispatch__LeaseTtlSeconds: ${DISPATCH_LEASE_TTL_SECONDS:-360}
      Pricing__AllowInsecureProviderEndpoints: ${PRICING_ALLOW_INSECURE_PROVIDER_ENDPOINTS:-true}
      Pricing__Providers__mock__Endpoint: ${PRICING_PROVIDER_MOCK_ENDPOINT:-http://provider-mock:8081/v1/pricing}
      Payments__AllowInsecureProviderEndpoints: ${PAYMENTS_ALLOW_INSECURE_PROVIDER_ENDPOINTS:-true}
      Payments__Providers__mock__Endpoint: ${PAYMENTS_PROVIDER_MOCK_ENDPOINT:-http://provider-mock:8081/v1/payments/checkout}
      Payments__Providers__mock__RefundEndpoint: ${PAYMENTS_PROVIDER_MOCK_REFUND_ENDPOINT:-http://provider-mock:8081/v1/payments/refunds}
      Payments__Providers__mock__ApiKey: ${PAYMENTS_PROVIDER_MOCK_API_KEY:-mock-payment-key}
      Payments__Providers__stripe__Endpoint: ${PAYMENTS_STRIPE_ENDPOINT:-https://api.stripe.com/v1/checkout/sessions}
      Payments__Providers__stripe__SecretKey: ${PAYMENTS_STRIPE_SECRET_KEY:-}
      Payments__Providers__stripe__SuccessUrl: ${PAYMENTS_STRIPE_SUCCESS_URL:-https://example.invalid/payment/success}
      Payments__Providers__stripe__CancelUrl: ${PAYMENTS_STRIPE_CANCEL_URL:-https://example.invalid/payment/cancel}
      Payments__Providers__stripe__ProductName: ${PAYMENTS_STRIPE_PRODUCT_NAME:-ScalaAPI credit}
      FaultInjection__Hook: ${PLATFORM_FAULT_HOOK:-}
      FaultInjection__MarkerDirectory: ${PLATFORM_FAULT_MARKER_DIR:-/var/run/scalaapi/fault-hooks}
      FaultInjection__Repeat: ${PLATFORM_FAULT_REPEAT:-false}
      Orleans__SingleSiloRecovery: ${ORLEANS_SINGLE_SILO_RECOVERY:-false}
      Internal__CacheRebuildToken: ${INTERNAL_CACHE_REBUILD_TOKEN:-}
      Internal__ReconciliationToken: ${INTERNAL_RECONCILIATION_TOKEN:?INTERNAL_RECONCILIATION_TOKEN is required}
      ObjectStorage__Endpoint: http://object-storage:9000
      ObjectStorage__PublicEndpoint: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      ObjectStorage__Bucket: ${OBJECT_STORAGE_BUCKET:-scalaapi-media}
      ObjectStorage__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY:-platform}
      ObjectStorage__SecretKey: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      ObjectStorage__AsyncRetentionHours: ${OBJECT_STORAGE_ASYNC_RETENTION_HOURS:-24}
      ObjectStorage__BatchRetentionHours: ${OBJECT_STORAGE_BATCH_RETENTION_HOURS:-168}
      ASPNETCORE_URLS: http://0.0.0.0:5000
    volumes:
      - runtime_sockets:/var/run/scalaapi
    depends_on:
      migrate:
        condition: service_completed_successfully
      provider-mock:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      garnet-health:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  admin-api:
    build:
      context: ../..
      target: admin-api
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=${POSTGRES_DB:-platform};Username=${POSTGRES_USER:-platform};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      ASPNETCORE_URLS: http://0.0.0.0:5001
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__Issuer: ${JWT_ISSUER:-platform-admin}
      Admin__Username: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      Admin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      Security__MasterKey: ${SECURITY_MASTER_KEY:?SECURITY_MASTER_KEY is required}
      Platform__InternalUrl: http://platform-silo:5000
      Internal__ReconciliationToken: ${INTERNAL_RECONCILIATION_TOKEN:?INTERNAL_RECONCILIATION_TOKEN is required}
      Payments__WebhookSecrets__mock: ${PAYMENTS_WEBHOOK_SECRET_MOCK:-}
      Payments__WebhookSecrets__stripe: ${PAYMENTS_WEBHOOK_SECRET_STRIPE:-}
      Payments__StripeWebhookToleranceSeconds: ${PAYMENTS_STRIPE_WEBHOOK_TOLERANCE_SECONDS:-300}
      Payments__AllowInsecureProviderEndpoints: ${PAYMENTS_ALLOW_INSECURE_PROVIDER_ENDPOINTS:-true}
      Payments__Providers__mock__Endpoint: ${PAYMENTS_PROVIDER_MOCK_ENDPOINT:-http://provider-mock:8081/v1/payments/checkout}
      Payments__Providers__mock__RefundEndpoint: ${PAYMENTS_PROVIDER_MOCK_REFUND_ENDPOINT:-http://provider-mock:8081/v1/payments/refunds}
      Payments__Providers__mock__ApiKey: ${PAYMENTS_PROVIDER_MOCK_API_KEY:-mock-payment-key}
      Payments__Providers__stripe__RefundEndpoint: ${PAYMENTS_STRIPE_REFUND_ENDPOINT:-https://api.stripe.com/v1/refunds}
      Payments__Providers__stripe__SecretKey: ${PAYMENTS_STRIPE_SECRET_KEY:-}
      PasswordReset__ExposeToken: ${PASSWORD_RESET_EXPOSE_TOKEN:-false}
      EmailVerification__ExposeToken: ${EMAIL_VERIFICATION_EXPOSE_TOKEN:-false}
      Email__Provider: ${EMAIL_PROVIDER:-smtp}
      Email__PublicBaseUrl: ${EMAIL_PUBLIC_BASE_URL:-http://localhost:5173}
      Email__PollSeconds: ${EMAIL_POLL_SECONDS:-5}
      Email__CaptureDirectory: ${EMAIL_CAPTURE_DIRECTORY:-/tmp/scalaapi-email}
      Backup__Directory: /var/lib/scalaapi/backups
      Backup__RestoreTargetConnection: ${BACKUP_RESTORE_TARGET_CONNECTION:-}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-noreply@example.invalid}
      Smtp__SecureSocketOptions: ${SMTP_SECURE_SOCKET_OPTIONS:-StartTls}
      OAuth__GitHub__ClientId: ${OAUTH_GITHUB_CLIENT_ID:-mock-client}
      OAuth__GitHub__ClientSecret: ${OAUTH_GITHUB_CLIENT_SECRET:-mock-secret}
      OAuth__GitHub__AuthorizationEndpoint: ${OAUTH_GITHUB_AUTHORIZATION_ENDPOINT:-http://provider-mock:8081/oauth/authorize}
      OAuth__GitHub__TokenEndpoint: ${OAUTH_GITHUB_TOKEN_ENDPOINT:-http://provider-mock:8081/oauth/token}
      OAuth__GitHub__UserEndpoint: ${OAUTH_GITHUB_USER_ENDPOINT:-http://provider-mock:8081/oauth/user}
      OAuth__Google__ClientId: ${OAUTH_GOOGLE_CLIENT_ID:-mock-client}
      OAuth__Google__ClientSecret: ${OAUTH_GOOGLE_CLIENT_SECRET:-mock-secret}
      OAuth__Google__AuthorizationEndpoint: ${OAUTH_GOOGLE_AUTHORIZATION_ENDPOINT:-http://provider-mock:8081/oauth/authorize}
      OAuth__Google__TokenEndpoint: ${OAUTH_GOOGLE_TOKEN_ENDPOINT:-http://provider-mock:8081/oauth/token}
      OAuth__Google__UserEndpoint: ${OAUTH_GOOGLE_USER_ENDPOINT:-http://provider-mock:8081/oauth/user}
    volumes:
      - backup_data:/var/lib/scalaapi/backups
    depends_on:
      platform-silo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5001/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  gateway:
    image: ${GATEWAY_IMAGE:-scalaapi-gateway:dev}
    build: ../../../gateway
    restart: on-failure
    environment:
      GATEWAY_CORES: ${GATEWAY_CORES:-2}
      GATEWAY_LISTEN_PORT: 8080
      GARNET_HOST: garnet
      GARNET_PORT: 6379
      GARNET_PASSWORD: ${GARNET_PASSWORD:?GARNET_PASSWORD is required}
      GARNET_TLS: ${GARNET_TLS:-false}
      GARNET_SERVER_NAME: ${GARNET_SERVER_NAME:-garnet}
      GARNET_CA_CERT_PATH: ${GARNET_CA_CERT_PATH:-}
      CAPNP_UDS_PATH: /var/run/scalaapi/dispatch.sock
      GATEWAY_USAGE_DB: /var/lib/scalaapi/usage-outbox.db
      GATEWAY_TRUSTED_PROXY_CIDRS: ${GATEWAY_TRUSTED_PROXY_CIDRS:-}
      GATEWAY_FAULT_HOOK: ${GATEWAY_FAULT_HOOK:-}
      GATEWAY_FAULT_MARKER_DIR: ${GATEWAY_FAULT_MARKER_DIR:-/var/lib/scalaapi/fault-hooks}
      GATEWAY_FAULT_REPEAT: ${GATEWAY_FAULT_REPEAT:-false}
    volumes:
      - runtime_sockets:/var/run/scalaapi
      - gateway_data:/var/lib/scalaapi
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      platform-silo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  admin-web:
    build: ../../admin-web
    ports:
      - "${ADMIN_WEB_PORT:-3000}:80"
    depends_on:
      admin-api:
        condition: service_healthy

  user-web:
    build: ../../user-web
    ports:
      - "${USER_WEB_PORT:-3001}:80"
    depends_on:
      admin-api:
        condition: service_healthy

volumes:
  pgdata:
  garnet_data:
  object_data:
  runtime_sockets:
  gateway_data:
  backup_data:
