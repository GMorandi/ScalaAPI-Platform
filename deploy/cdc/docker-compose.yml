services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    profiles: [cdc]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 30

  debezium:
    image: quay.io/debezium/connect:3.0
    profiles: [cdc]
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: platform-cdc-connect
      CONFIG_STORAGE_TOPIC: _debezium_connect_configs
      OFFSET_STORAGE_TOPIC: _debezium_connect_offsets
      STATUS_STORAGE_TOPIC: _debezium_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      REST_ADVERTISED_HOST_NAME: debezium
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "${DEBEZIUM_PORT:-8083}:8083"

volumes:
  redpanda_data:
