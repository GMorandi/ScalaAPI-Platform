name: User Web Build

on:
  push:
    branches: [master]
    paths:
      - "user-web/**"
  pull_request:
    branches: [master]
    paths:
      - "user-web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: user-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
