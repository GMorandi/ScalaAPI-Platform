name: Docker Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: platform-silo
            image: scalaapi-platform
          - target: admin-api
            image: scalaapi-admin-api
          - target: migrate
            image: scalaapi-migrator
          - target: provider-mock
            image: scalaapi-provider-mock
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/gmorandi/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/gmorandi/${{ matrix.image }}:latest
