name: Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run unit tests
        run: |
          dotnet test test/Grains.Tests -c Release --no-build --verbosity normal --logger "trx;LogFileName=grains.trx"
          dotnet test test/Host.Tests -c Release --no-build --verbosity normal --logger "trx;LogFileName=host.trx"
          dotnet test test/Admin.Tests -c Release --no-build --verbosity normal --logger "trx;LogFileName=admin.trx"
          dotnet test test/Provider.Mock.Tests -c Release --no-build --verbosity normal --logger "trx;LogFileName=provider.trx"

      - name: Run benchmarks (smoke)
        run: dotnet run --project test/Platform.Benchmarks -c Release --no-build -- --filter * --job dry

      - name: Validate migrations
        run: |
          echo "Validating migration files..."
          ls -1 deploy/migrations/*.sql | wc -l | xargs -I {} echo "Migration count: {}"
          for f in deploy/migrations/*.sql; do
            echo "Checking $f"
            [ -s "$f" ] || { echo "Empty migration: $f"; exit 1; }
          done

      - name: Security scan
        run: |
          dotnet list package --vulnerable --include-transitive || true
          dotnet list package --vulnerable --include-transitive | grep -i "critical\|high" && exit 1 || echo "No critical/high vulnerabilities found"

      - name: Generate report
        if: always()
        run: |
          echo "## Platform CI Report" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test projects: Grains.Tests, Host.Tests, Admin.Tests, Provider.Mock.Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Benchmarks: dry run completed" >> $GITHUB_STEP_SUMMARY
          echo "- Migrations: $(ls -1 deploy/migrations/*.sql 2>/dev/null | wc -l) validated" >> $GITHUB_STEP_SUMMARY
          echo "- Skip reasons: none" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-test-results
          path: test/**/TestResults/*.trx
