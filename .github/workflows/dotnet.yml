name: .NET Build

on:
  workflow_call:
  push:
    branches: [master]
    paths-ignore:
      - "gateway/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "gateway/**"

permissions:
  contents: read

concurrency:
  group: platform-dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Platform .NET build, tests, and benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: docker.io/library/postgres:17-alpine@sha256:af194ccf3e2d7fe367012c7b88ce8b816c5c889b18a5b316799a1f0d7eac746a
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      GREENFIELD_SCHEMA_CONNECTION: Host=localhost;Port=5432;Database=platform;Username=platform;Password=ci-password
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build the pinned Cap'n Proto compiler
        run: |
          git clone --depth 1 --branch v1.0.2 https://github.com/capnproto/capnproto.git "$RUNNER_TEMP/capnproto"
          test "$(git -C "$RUNNER_TEMP/capnproto" rev-parse HEAD)" = "1a0e12c0a3ba1f0dbbad45ddfef555166e0a14fc"
          cmake -S "$RUNNER_TEMP/capnproto" -B "$RUNNER_TEMP/capnproto-build" -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/capnproto-build" --target capnp_tool --parallel 2
          echo "CAPNP_COMPILER=$RUNNER_TEMP/capnproto-build/c++/src/capnp/capnp" >> "$GITHUB_ENV"

      - name: Verify generated contracts and retired dependencies
        run: |
          scripts/verify-generated-contracts.sh
          scripts/verify-retired-dependencies.sh

      - name: Restore
        run: dotnet restore

      - name: Scan restored packages for high-severity vulnerabilities
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 |
            tee "$RUNNER_TEMP/platform-vulnerabilities.txt"
          if grep -Eiq 'critical|high' "$RUNNER_TEMP/platform-vulnerabilities.txt"; then
            echo "Critical or high severity package vulnerability found" >&2
            exit 1
          fi

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Apply the greenfield schema twice
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=platform;Username=platform;Password=ci-password
        run: |
          set -euo pipefail
          migration_dir="$RUNNER_TEMP/migrations"
          mkdir -p "$migration_dir"
          cp deploy/orleans-postgres-schema.sql "$migration_dir/000-orleans.sql"
          cp deploy/migrations/*.sql "$migration_dir/"
          dotnet run --project src/Db.Migrator/Db.Migrator.csproj --no-build -c Release -- "$migration_dir"
          dotnet run --project src/Db.Migrator/Db.Migrator.csproj --no-build -c Release -- "$migration_dir"

      - name: Verify the resulting schema
        run: >-
          dotnet test test/Host.Tests/Host.Tests.csproj
          --no-build -c Release
          --filter FullyQualifiedName~MigrationSchemaTests
          --verbosity normal

      - name: Test
        run: >-
          dotnet test --no-build -c Release
          --verbosity normal --logger "trx;LogFileName=platform.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-test-results-${{ github.sha }}
          path: test/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 30

      - name: Benchmarks (short, archived)
        run: >-
          dotnet run --project test/Platform.Benchmarks -c Release --no-build --
          --job Short --filter '*Scheduler*'
          --exporters json --artifacts "$RUNNER_TEMP/platform-benchmarks"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-benchmarks-${{ github.sha }}
          path: ${{ runner.temp }}/platform-benchmarks/**
          if-no-files-found: warn
          retention-days: 30
